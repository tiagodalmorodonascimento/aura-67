// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// O projeto fica no OneDrive, mas os artefatos temporários precisam ficar fora
// da sincronização para evitar bloqueios de arquivo durante a compilação.
def auraBuildRoot = new File(System.getenv('LOCALAPPDATA'), 'Aura67Build')
rootProject.buildDir = new File(auraBuildRoot, 'root')
subprojects {
    project.buildDir = new File(auraBuildRoot, project.name)
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete auraBuildRoot
}
